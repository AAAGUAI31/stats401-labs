<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 9 演示：D3 地理可视化</title>
  <style>
    /* 步骤 1：页面样式。演示所需的 CSS 全部保存在本文件中。 */
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d7deea;
      --panel: #ffffff;
      --background: #f4f7fb;
      --accent: #176b87;
      --missing: #e4e7ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: Inter, "Microsoft YaHei", Arial, sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    h1 { margin: 0 0 10px; font-size: clamp(1.9rem, 4vw, 2.8rem); }
    h2 { margin: 0; font-size: 1.2rem; }
    p { line-height: 1.65; }

    .intro {
      max-width: 82ch;
      margin: 0 0 22px;
      color: var(--muted);
    }

    .notice {
      margin-bottom: 18px;
      padding: 12px 15px;
      color: #315365;
      border-left: 4px solid #38a3a5;
      border-radius: 0 8px 8px 0;
      background: #e9f7f6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgb(15 23 42 / 7%);
    }

    .panel-header {
      display: flex;
      padding: 17px 18px 13px;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid #edf0f5;
    }

    .panel-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    button {
      padding: 7px 10px;
      color: var(--ink);
      border: 1px solid #c9d2df;
      border-radius: 7px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible { border-color: var(--accent); outline-color: var(--accent); }

    #map-wrap { position: relative; min-height: 470px; }
    #map { display: block; width: 100%; height: auto; background: #fbfcfe; }

    .country {
      cursor: pointer;
      vector-effect: non-scaling-stroke;
      transition: filter 100ms ease;
    }

    .country:hover,
    .country.is-active {
      stroke: #111827;
      stroke-width: 2.2;
      filter: brightness(1.04);
    }

    .graticule {
      fill: none;
      stroke: #d8e1ea;
      stroke-width: 0.6;
      vector-effect: non-scaling-stroke;
    }

    .location-dot {
      fill: #e63946;
      stroke: #fff;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .location-label {
      fill: #8d1721;
      font-size: 12px;
      font-weight: 750;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    #legend { padding: 8px 18px 17px; }
    #legend svg { display: block; max-width: 100%; overflow: visible; }
    .legend-title { fill: var(--ink); font-size: 12px; font-weight: 700; }
    .missing-key { margin-top: 4px; color: var(--muted); font-size: 0.78rem; }
    .missing-swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; background: var(--missing); border: 1px solid #c7ccd3; }

    .data-panel { padding-bottom: 10px; }
    .data-panel h2 { padding: 17px 16px 5px; }
    .data-panel > p { margin: 0; padding: 0 16px 11px; color: var(--muted); font-size: 0.82rem; }
    #data-list { display: grid; gap: 5px; padding: 0 10px; }
    .data-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      width: 100%;
      padding: 8px;
      text-align: left;
      border-color: transparent;
    }
    .data-row.is-active { color: #fff; border-color: var(--accent); background: var(--accent); }
    .iso { color: #667085; font-size: 0.75rem; font-weight: 800; letter-spacing: .04em; }
    .data-row.is-active .iso { color: #d7f2f2; }
    .value { font-variant-numeric: tabular-nums; font-weight: 750; }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      padding: 30px;
      place-items: center;
      color: var(--muted);
      text-align: center;
      pointer-events: none;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      max-width: 230px;
      padding: 9px 11px;
      color: #fff;
      border-radius: 7px;
      background: rgb(23 32 51 / 96%);
      box-shadow: 0 7px 20px rgb(0 0 0 / 22%);
      font-size: 0.82rem;
      line-height: 1.55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 100ms ease;
    }

    .back-link { display: inline-block; margin-top: 22px; color: #176b87; font-weight: 700; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .data-panel { order: 2; }
      #data-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #map-wrap { min-height: 320px; }
    }

    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1180px); padding-top: 22px; }
      .panel-header { align-items: flex-start; }
      #data-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lab 9：D3 地理可视化演示</h1>
    <p class="intro">这个单文件示例把 GeoJSON、经纬度投影、数据连接、分级设色、图例、提示框、高亮和缩放整合在一起。示例数值只是课堂演示指标，不是 Assignment 的 2025 GDP 数据。</p>
    <div class="notice">本页只整理 Assignment 之前的演示内容；没有实现 GDP cartogram，也没有开始完成 Assignment。</div>

    <div class="layout">
      <section class="panel" aria-labelledby="map-title">
        <div class="panel-header">
          <div>
            <h2 id="map-title">世界分级设色图</h2>
            <p>颜色 = 演示指标；红点 = 经纬度投影后的上海位置。</p>
          </div>
          <button id="reset-zoom" type="button">重置缩放</button>
        </div>
        <div id="map-wrap">
          <svg id="map" viewBox="0 0 900 520" role="img" aria-label="可缩放的世界分级设色地图"></svg>
          <div id="status">正在加载 GeoJSON…</div>
        </div>
        <div id="legend"></div>
      </section>

      <aside class="panel data-panel" aria-labelledby="data-title">
        <h2 id="data-title">演示统计数据</h2>
        <p>把鼠标移到列表或地图上，会通过 ISO-3 标识符联动高亮。</p>
        <div id="data-list"></div>
      </aside>
    </div>

    <a class="back-link" href="index.html">返回 Lab 9 页面</a>
  </main>

  <div id="tooltip" class="tooltip" role="status" aria-hidden="true"></div>

  <!-- 步骤 2：加载 D3。这里复用仓库中已有的 D3 v7 文件。 -->
  <script src="../lab8/d3.v7.min.js"></script>
  <script>
    // ================================================================
    // 步骤 3：准备画布尺寸和演示数据
    // ================================================================
    const width = 900;
    const height = 520;

    // 这些是假设的课堂演示指标，仅用于说明“统计数据如何与地图连接”。
    // iso3 必须和 GeoJSON 中的国家 ID 一致。
    const demoStats = [
      { iso3: "USA", country: "United States", value: 92 },
      { iso3: "CHN", country: "China", value: 84 },
      { iso3: "IND", country: "India", value: 71 },
      { iso3: "JPN", country: "Japan", value: 64 },
      { iso3: "DEU", country: "Germany", value: 58 },
      { iso3: "BRA", country: "Brazil", value: 49 },
      { iso3: "CAN", country: "Canada", value: 43 },
      { iso3: "FRA", country: "France", value: 37 },
      { iso3: "AUS", country: "Australia", value: 31 },
      { iso3: "ZAF", country: "South Africa", value: 24 }
    ];

    // Map 可以通过 iso3 快速查找统计值，避免为每个国家反复遍历数组。
    const statsByIso3 = new Map(demoStats.map(d => [d.iso3, d]));

    const svg = d3.select("#map");
    const mapGroup = svg.append("g").attr("class", "map-layer");
    const tooltip = d3.select("#tooltip");
    const status = d3.select("#status");

    // ================================================================
    // 步骤 4：创建投影和地理路径生成器
    // ================================================================
    // Natural Earth 投影适合展示整幅世界地图。
    const projection = d3.geoNaturalEarth1();

    // geoPath 会把投影后的 GeoJSON 几何转换成 SVG path 的 d 属性。
    const path = d3.geoPath().projection(projection);

    // ================================================================
    // 步骤 5：创建颜色比例尺
    // ================================================================
    const maxValue = d3.max(demoStats, d => d.value);
    const colorScale = d3.scaleSequential(d3.interpolateBlues)
      .domain([0, maxValue]);

    // 没有演示数据的国家使用中性灰色，而不是被错误地当作数值 0。
    const missingColor = "#e4e7ec";

    // ================================================================
    // 步骤 6：读取 GeoJSON，再用 ISO-3 标识符连接统计数据
    // ================================================================
    const geoJsonUrl = "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json";

    d3.json(geoJsonUrl)
      .then(geoData => {
        // 此数据源把 ISO-3 保存在 feature.id 中。
        // 下面的后备字段让示例也兼容一些常见的 GeoJSON 命名方式。
        const getIso3 = feature => String(
          feature.id ||
          feature.properties.iso3 ||
          feature.properties.iso_a3 ||
          feature.properties.ISO_A3 ||
          ""
        ).toUpperCase();

        // 南极洲会占据很大的底部区域；课堂世界地图中先过滤掉它。
        geoData.features = geoData.features.filter(d => getIso3(d) !== "ATA");

        // 把统计对象写入每个 feature 的 properties，完成 geographic + statistical join。
        geoData.features.forEach(feature => {
          const iso3 = getIso3(feature);
          feature.properties.iso3 = iso3;
          feature.properties.stat = statsByIso3.get(iso3) || null;
        });

        // 根据实际 GeoJSON 自动调整比例和位移，使地图放入 SVG。
        projection.fitExtent([[18, 18], [width - 18, height - 28]], geoData);

        // 先绘制经纬网，帮助观察投影产生的形变。
        mapGroup.append("path")
          .datum(d3.geoGraticule10())
          .attr("class", "graticule")
          .attr("d", path);

        // ============================================================
        // 步骤 7：把 GeoJSON feature 绘制为 SVG path
        // ============================================================
        const countries = mapGroup.selectAll(".country")
          .data(geoData.features)
          .join("path")
          .attr("class", "country")
          .attr("d", path)
          .attr("fill", d => {
            const stat = d.properties.stat;
            return stat ? colorScale(stat.value) : missingColor;
          })
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 0.7)
          .attr("tabindex", 0)
          .attr("aria-label", d => countryDescription(d));

        // ============================================================
        // 步骤 8：使用 [longitude, latitude] 添加上海位置标记
        // ============================================================
        const shanghai = [121.47, 31.23];
        const [shanghaiX, shanghaiY] = projection(shanghai);

        mapGroup.append("circle")
          .attr("class", "location-dot")
          .attr("cx", shanghaiX)
          .attr("cy", shanghaiY)
          .attr("r", 4);

        mapGroup.append("text")
          .attr("class", "location-label")
          .attr("x", shanghaiX + 7)
          .attr("y", shanghaiY - 7)
          .text("Shanghai");

        // ============================================================
        // 步骤 9：添加 tooltip 和地图高亮事件
        // ============================================================
        countries
          .on("pointerenter", function(event, d) {
            setActiveCountry(d.properties.iso3);
            showTooltip(event, d);
          })
          .on("pointermove", moveTooltip)
          .on("pointerleave", clearInteraction)
          .on("focus", function(event, d) {
            setActiveCountry(d.properties.iso3);
            showTooltip(event, d);
          })
          .on("blur", clearInteraction);

        // ============================================================
        // 步骤 10：添加缩放和平移；只变换 mapGroup，不改变 SVG 本身
        // ============================================================
        const zoom = d3.zoom()
          .scaleExtent([1, 8])
          .on("zoom", event => {
            mapGroup.attr("transform", event.transform);
          });

        svg.call(zoom);

        d3.select("#reset-zoom").on("click", () => {
          svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity);
        });

        // ============================================================
        // 步骤 11：创建连续色带图例和可联动的数据列表
        // ============================================================
        drawLegend(colorScale, maxValue);
        drawDataList();
        status.style("display", "none");

        function countryDescription(feature) {
          const name = feature.properties.name || feature.properties.iso3 || "Unknown";
          const stat = feature.properties.stat;
          return stat ? `${name}，演示指标 ${stat.value}` : `${name}，无演示数据`;
        }

        function showTooltip(event, feature) {
          const name = feature.properties.name || feature.properties.iso3 || "Unknown";
          const stat = feature.properties.stat;
          tooltip
            .attr("aria-hidden", "false")
            .style("opacity", 1)
            .html(
              `<strong>${escapeHtml(name)}</strong><br>` +
              `ISO-3：${escapeHtml(feature.properties.iso3 || "—")}<br>` +
              `演示指标：${stat ? stat.value : "无数据"}`
            );
          moveTooltip(event);
        }

        function moveTooltip(event) {
          // 键盘 focus 事件没有 pageX/pageY，因此放到视窗左上方的安全位置。
          const left = Number.isFinite(event.pageX) ? event.pageX + 12 : 18;
          const top = Number.isFinite(event.pageY) ? event.pageY + 12 : 18;
          tooltip.style("left", `${left}px`).style("top", `${top}px`);
        }

        function setActiveCountry(iso3) {
          countries.classed("is-active", d => d.properties.iso3 === iso3);
          d3.selectAll(".data-row").classed("is-active", d => d.iso3 === iso3);
        }

        function clearInteraction() {
          setActiveCountry(null);
          tooltip.attr("aria-hidden", "true").style("opacity", 0);
        }

        function drawDataList() {
          d3.select("#data-list")
            .selectAll("button")
            .data([...demoStats].sort((a, b) => d3.descending(a.value, b.value)))
            .join("button")
            .attr("type", "button")
            .attr("class", "data-row")
            .html(d =>
              `<span class="iso">${d.iso3}</span>` +
              `<span>${escapeHtml(d.country)}</span>` +
              `<span class="value">${d.value}</span>`
            )
            .on("pointerenter focus", function(event, d) {
              setActiveCountry(d.iso3);
            })
            .on("pointerleave blur", clearInteraction);
        }
      })
      .catch(error => {
        console.error(error);
        status
          .style("color", "#b42318")
          .text("GeoJSON 加载失败。请确认网络连接，并通过本地服务器打开此页面。");
      });

    // ================================================================
    // 步骤 12：图例是独立函数，输入颜色比例尺和最大值即可复用
    // ================================================================
    function drawLegend(scale, maximum) {
      const legendWidth = 280;
      const legendHeight = 58;
      const marginLeft = 8;
      const barWidth = 250;

      const legendSvg = d3.select("#legend")
        .append("svg")
        .attr("viewBox", `0 0 ${legendWidth} ${legendHeight}`)
        .attr("width", legendWidth)
        .attr("height", legendHeight);

      const gradientId = "demo-color-gradient";
      const gradient = legendSvg.append("defs")
        .append("linearGradient")
        .attr("id", gradientId)
        .attr("x1", "0%")
        .attr("x2", "100%");

      // 多个 stop 让 SVG 色带近似显示 D3 的连续插值颜色。
      gradient.selectAll("stop")
        .data(d3.range(0, 1.01, 0.1))
        .join("stop")
        .attr("offset", d => `${d * 100}%`)
        .attr("stop-color", d => scale(d * maximum));

      legendSvg.append("text")
        .attr("class", "legend-title")
        .attr("x", marginLeft)
        .attr("y", 12)
        .text("演示指标");

      legendSvg.append("rect")
        .attr("x", marginLeft)
        .attr("y", 18)
        .attr("width", barWidth)
        .attr("height", 12)
        .attr("fill", `url(#${gradientId})`);

      const legendScale = d3.scaleLinear()
        .domain([0, maximum])
        .range([marginLeft, marginLeft + barWidth]);

      legendSvg.append("g")
        .attr("transform", "translate(0, 30)")
        .call(d3.axisBottom(legendScale).ticks(5).tickSize(4));

      d3.select("#legend")
        .append("div")
        .attr("class", "missing-key")
        .html(`<span class="missing-swatch"></span>灰色 = 无演示数据（不是 0）`);
    }

    // tooltip 会插入 GeoJSON 中的国家名称；先转义特殊字符，避免被当作 HTML。
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
